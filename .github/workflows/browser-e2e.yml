name: Browser E2E Security

on:
  pull_request:
    branches: ["main", "feat/platform-foundation", "feat/workspace-admin"]
    paths:
      - "src/**"
      - "prisma/**"
      - "tests/e2e/**"
      - "scripts/seed-e2e.ts"
      - "playwright.config.ts"
      - "package.json"
      - ".github/workflows/browser-e2e.yml"
  workflow_dispatch:

concurrency:
  group: browser-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: google_creator_os_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d google_creator_os_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/google_creator_os_test
      NODE_ENV: test
      E2E_TEST_MODE: "true"
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      AUTH_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      E2E_OWNER_EMAIL: e2e-owner@example.test
      E2E_MEMBER_EMAIL: e2e-member@example.test
      E2E_OUTSIDER_EMAIL: e2e-outsider@example.test
      E2E_PASSWORD: E2E-Password-Change-Me-123!

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Seed browser E2E database
        id: seed
        shell: bash
        run: |
          seed_json="$(npm run seed:e2e --silent)"
          echo "$seed_json"
          echo "E2E_MEMBER_ID=$(echo "$seed_json" | jq -r '.memberId')" >> "$GITHUB_ENV"
          echo "E2E_WORKSPACE_ID=$(echo "$seed_json" | jq -r '.workspaceId')" >> "$GITHUB_ENV"
          echo "E2E_OUTSIDER_WORKSPACE_ID=$(echo "$seed_json" | jq -r '.outsiderWorkspaceId')" >> "$GITHUB_ENV"
          echo "E2E_RECOVERY_CODES=$(echo "$seed_json" | jq -r '.recoveryCodes | join(",")')" >> "$GITHUB_ENV"

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run browser E2E
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
